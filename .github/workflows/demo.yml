# Spin up / tear down a phone-service POS demo at https://demo-<name>.sfera.my
# Actions -> "Phone POS demo" -> Run workflow. Builds service-pos-ph here (sfera1
# is too small to run vite) and pipes the bundle to deploy/demo/demo.sh over an
# SSH key that is forced to that script, never a shell.
name: Phone POS demo

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [create, destroy, list]
        default: create
      name:
        description: "Demo name (a-z, 0-9, -) -> demo-<name>.sfera.my"
        type: string
        required: false
      days:
        description: Days before it auto-expires (create only)
        type: number
        default: 14

concurrency: phone-pos-demo

env:
  DEMO_HOST: mnamz@sfera1.vps.webdock.cloud

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate input
        env:
          ACTION: ${{ inputs.action }}
          NAME: ${{ inputs.name }}
          DAYS: ${{ inputs.days }}
        run: |
          if [ "$ACTION" != list ]; then
            [[ $NAME =~ ^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$ ]] || { echo "::error::name must be 1-24 chars of a-z, 0-9, '-'"; exit 1; }
          fi
          [[ $DAYS =~ ^[0-9]+$ ]] || { echo "::error::days must be a number"; exit 1; }

      - uses: actions/checkout@v4
        if: inputs.action == 'create'
        with:
          ref: service-pos-ph

      - uses: shivammathur/setup-php@v2
        if: inputs.action == 'create'
        with:
          php-version: '8.3'
          tools: composer:v2

      - uses: actions/setup-node@v4
        if: inputs.action == 'create'
        with:
          node-version: 22
          cache: npm

      - name: Build app bundle
        if: inputs.action == 'create'
        run: |
          composer install --no-dev -o --no-interaction --no-progress
          npm ci --no-audit --no-fund
          npm run build
          tar -czf "$RUNNER_TEMP/app.tgz" \
            --exclude=./.git --exclude=./node_modules --exclude=./tests --exclude=./.github \
            --exclude=./.env --exclude='./storage/logs/*' --exclude='./bootstrap/cache/*.php' .
          ls -lh "$RUNNER_TEMP/app.tgz"

      - name: Run on sfera1
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
          ACTION: ${{ inputs.action }}
          NAME: ${{ inputs.name }}
          DAYS: ${{ inputs.days }}
        run: |
          set -o pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_demo && chmod 600 ~/.ssh/id_demo
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_demo() { ssh -i ~/.ssh/id_demo -o IdentitiesOnly=yes -o ServerAliveInterval=30 "$DEMO_HOST" "$@"; }
          case $ACTION in
            create) ssh_demo "create $NAME $DAYS" < "$RUNNER_TEMP/app.tgz" ;;
            destroy) ssh_demo "destroy $NAME" < /dev/null ;;
            list) ssh_demo list < /dev/null ;;
          esac | tee out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
